<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sequential Image Widget</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #191919;
    }

    img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
        display: block;
    }
</style>
</head>
<body>

<img id="image" alt="Sequential image" />

<script>
    const images = [
          "https://i.pinimg.com/736x/02/98/d7/0298d7fbfdde1c22706b59bb7945d400.jpg", // persée tient une tête 
          "https://i.pinimg.com/1200x/1d/49/4a/1d494ac7306e0a7ae1f3071b60cf57ad.jpg", // mains rouges couvrent la bouche
          "https://i.pinimg.com/736x/7c/55/17/7c55178d299710c9c97408d2bf228adc.jpg", // échiqier
      //  "https://i.pinimg.com/736x/68/9a/c5/689ac5801a48e8f29296c801f3fbfb32.jpg", // esquisse tour reine cavalier
          "https://i.pinimg.com/736x/a3/24/3b/a3243b1d8df1eeb619da5968a7b45dad.jpg", // pile de livres avec bougie
      //  "https://i.pinimg.com/736x/10/f8/3f/10f83fce44b619204312ad0055fc207a.jpg", // dessin arche
          "https://i.pinimg.com/736x/a8/b9/10/a8b910d7b341eea4f787f6cfe63e8b99.jpg", // esquisse arche
      //  "https://i.pinimg.com/736x/fe/fa/45/fefa45255fe0a6493d7eb4b16b0c2e7d.jpg", // colonne avec rose
      //  "https://i.pinimg.com/1200x/f4/7b/8f/f47b8f241d537b8740a5cec207f5e8b7.jpg", // compass fractal
      //  "https://i.pinimg.com/736x/c3/b8/97/c3b897b8c6ff185718fb5a522c94d1cb.jpg", // school of Athens
          "https://i.pinimg.com/736x/34/fc/07/34fc072b7e6131552cbe2a81e9618ea2.jpg" // statue de marbre nature morte
      //  "https://i.pinimg.com/1200x/c4/60/39/c46039af559bb8573e7e9dedf35e8acc.jpg" // dessin cavalier prototype trigo
      //  "https://i.pinimg.com/736x/4e/af/18/4eaf1850628b560acfa5869e20dc78a6.jpg" // s
      //  "https://i.pinimg.com/1200x/48/82/ca/4882ca591568d4b677f35f8dc6f7a7e2.jpg" // s
          "https://i.pinimg.com/736x/d1/8f/0e/d18f0e2b7d50611d7607e0696263116a.jpg" // library
      //  "https://i.pinimg.com/1200x/1f/6a/0c/1f6a0c06c3536543598ce609ab596461.jpg" // nuages
      //  "https://i.pinimg.com/1200x/d7/02/82/d70282f806dff7413845f7e88a4fcda2.jpg" // pièces échecs sur une carte
    ];

    const STORAGE_KEY = "notion-image-index";
  const INTERVAL_MS = 15000; // change every 10 seconds

  const img = document.getElementById("image");

  let index = parseInt(localStorage.getItem(STORAGE_KEY), 10);

  if (isNaN(index)) {
    index = 0;
  } else {
    index = (index + 1) % images.length;
  }

  img.src = images[index] + "?v=" + Date.now();
  localStorage.setItem(STORAGE_KEY, index);

  // Timed rotation while page is open
  setInterval(() => {
    index = (index + 1) % images.length;
    img.src = images[index];
    localStorage.setItem(STORAGE_KEY, index);
  }, INTERVAL_MS);
</script>

</body>
</html>
